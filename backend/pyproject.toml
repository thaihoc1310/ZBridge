[project]
name = "zbridge-backend"
version = "0.1.0"
description = "FastAPI business backend for ZBridge"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "google-auth[requests]>=2.35,<3",
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "pillow>=12.3,<13",
  "pypdfium2>=4.30,<5",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.5,<3",
  "pyjwt>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency declarations intentionally call Depends/Query.
