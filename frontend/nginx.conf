server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never let a CDN or browser cache an authenticated API response.
    add_header Cache-Control "no-store" always;
  }

  location = /health {
    proxy_pass http://backend:8000/health;
    add_header Cache-Control "no-store" always;
  }

  # Proxied so the docs work in development. In production the backend disables
  # them and answers 404, which is what should reach the caller — falling through
  # to the SPA would answer 200 for a path that does not exist.
  location /docs {
    proxy_pass http://backend:8000/docs;
    add_header Cache-Control "no-store" always;
  }

  location = /openapi.json {
    proxy_pass http://backend:8000/openapi.json;
    add_header Cache-Control "no-store" always;
  }

  # Vite emits content-hashed filenames, so these are safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The entry point must never be cached: a stale index.html would keep serving
  # the previous build's asset URLs after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
